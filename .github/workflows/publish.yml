# Publish to npm with Trusted Publishing (OIDC) + provenance. No token to leak.
#
# One-time setup on npmjs.com (maintainer):
#   Package @luizporto/rayo > Settings > Trusted Publisher > GitHub Actions:
#     Organization/user:  luizporto-ai
#     Repository:         rayo
#     Workflow filename:  publish.yml
#
# To release: bump "version" in package.json, commit, then publish a GitHub Release.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm test
      - run: npm publish --provenance --access public
